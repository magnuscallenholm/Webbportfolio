<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="700" viewBox="0 0 1800 700" role="img" aria-labelledby="titleSUDark descSUDark">
  <title id="titleSUDark">Södertörn University Stockholm logo on dark preview</title>
  <desc id="descSUDark">Södertörn University Stockholm logo on a dark preview background.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="60%" stop-color="#07182D"/>
      <stop offset="100%" stop-color="#030711"/>
    </linearGradient>
  </defs>
  <rect width="1800" height="700" rx="40" fill="url(#bg2)"/>
  <g transform="translate(0 50)">
