    <circle cx="190" cy="300" r="122" fill="none" stroke="#07182D" stroke-width="88"/>
    <circle cx="190" cy="300" r="64" fill="#F6D20C"/>
    <circle cx="760" cy="300" r="88" fill="#F6D20C"/>
