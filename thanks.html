<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&family=Luckiest+Guy&family=Permanent+Marker&family=Roboto:ital,wght@0,100..900;1,100..900&family=Sora:wght@100..800&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/thanks.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <title>Thank you</title>
  </head>

  <body class="thanks-body">
    <main class="thanks-page">
      <div class="thanks-card">
        <h1>Thank you!</h1>
        <p>Your message has been sent successfully.</p>

        <a class="thanks-button" href="index.html#package">
          Back to portfolio
        </a>
      </div>
    </main>
    <footer class="footer">
      <div class="footer-top-wrap">
        <a
          href="index.html#home"
          class="footer-brand"
          aria-label="Back to main"
        >
          <span class="brand-name">mange</span>
          <span class="brand-symbol">M</span>
        </a>

        <div class="weather-widget" id="weatherWidget">
          <span id="weatherCity">Stockholm</span>
          <span id="weatherIcon">20</span>
          <span id="weatherTemp">°C</span>
        </div>
      </div>

      <div class="footer-links">
        <a
          href="https://www.linkedin.com/in/magnus-callenholm-b5428569/"
          target="_blank"
          rel="noopener noreferrer"
          ><img
            src="assets/icons/linkedin-icon-optimized-transparent.svg"
            alt="linkedin icon"
            class="footer-icon"
        /></a>

        <a
          href="https://github.com/magnuscallenholm"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="assets/icons/github-icon-optimized-transparent.svg"
            alt="github icon"
            class="footer-icon"
        /></a>

        <a
          href="index.html#contact"
          class="footer-mail-link"
          aria-label="go to contact form"
        >
          <img
            src="assets/icons/mail-icon-optimized-transparent.svg"
            alt="mail icon"
            class="footer-icon"
        /></a>
      </div>
    </footer>
  </body>
</html>
